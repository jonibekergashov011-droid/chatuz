<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <meta n
  ame="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#212121">
<link rel="manifest" href="manifest.json">
  <title>UPG CHAT AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Mobil uchun asosiy sozlamalar */
    * {
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      box-sizing: border-box;
    }
    
    html, body {
      height: 100%;
      overflow: hidden;
      position: fixed;
      width: 100%;
      touch-action: pan-y pinch-zoom;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overscroll-behavior: none;
    }
    
    /* Chat container mobil scroll */
    #chat-container {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 100px;
      height: calc(100vh - 80px);
    }
    
    /* Input maydoni mobil uchun */
    #user-input {
      font-size: 16px !important; /* Zoom oldini olish */
      line-height: 1.5;
      max-height: 120px;
      -webkit-appearance: none;
      border-radius: 24px;
    }
    
    /* Mobil tugmalar */
    button {
      min-height: 44px; /* Apple tavsiyasi */
      min-width: 44px;
      touch-action: manipulation;
    }
    
    /* Mobil sidebar */
    @media (max-width: 768px) {
      .mobile-sidebar {
        position: fixed;
        top: 0;
        left: -100%;
        width: 85%;
        height: 100%;
        z-index: 1000;
        transition: left 0.3s ease;
        box-shadow: 2px 0 20px rgba(0,0,0,0.5);
      }
      
      .mobile-sidebar.open {
        left: 0;
      }
      
      .sidebar-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0,0,0,0.5);
        z-index: 999;
        display: none;
      }
      
      .sidebar-overlay.open {
        display: block;
      }
      
      #chat-container {
        padding-left: 16px;
        padding-right: 16px;
        padding-top: 80px;
      }
    }
    
    /* Yuklash animatsiyasi */
    .loading-dots div {
      width: 8px;
      height: 8px;
      margin: 0 3px;
      background: #3b82f6;
      border-radius: 50%;
      display: inline-block;
      animation: bounce 1.4s infinite ease-in-out both;
    }
    
    .loading-dots div:nth-child(1) { animation-delay: -0.32s; }
    .loading-dots div:nth-child(2) { animation-delay: -0.16s; }
    
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }
    
    /* Xabarlar animatsiyasi */
    .message-fade {
      animation: fadeIn 0.3s ease-out;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    /* Klaviatura ochilganda */
    @media screen and (max-height: 500px) {
      #chat-container {
        padding-bottom: 60px;
      }
      
      .input-area {
        padding-bottom: 10px;
      }
    }
  </style>
</head>
<body class="bg-[#212121] text-gray-200 flex h-screen font-sans antialiased relative">

  <!-- Overlay (mobil sidebar uchun) -->
  <div id="sidebar-overlay" class="sidebar-overlay hidden"></div>

  <!-- Mobile Sidebar -->
  <aside id="mobile-sidebar" class="mobile-sidebar bg-[#171717] p-4 flex flex-col border-r border-white/5">
    <div class="flex items-center justify-between mb-8">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center font-bold text-white">U</div>
        <h1 class="font-bold text-xl text-white">UPG CHAT</h1>
      </div>
      <button id="close-sidebar" class="text-gray-400 hover:text-white p-2">
        <i class="fa-solid fa-times text-xl"></i>
      </button>
    </div>

    <button id="new-chat-btn-mobile" class="flex items-center gap-3 border border-white/20 rounded-xl p-3 hover:bg-[#2c2c2c] transition-all text-sm mb-6 text-white/90 hover:text-white">
      <i class="fa-solid fa-plus text-xs"></i> 
      <span>Yangi chat</span>
    </button>

    <div class="flex-1 overflow-y-auto">
      <p class="text-[11px] font-bold text-gray-500 uppercase px-2 mb-4 tracking-wider">CHATLAR TARIXI</p>
      <div id="chat-history-list-mobile" class="space-y-1">
        <div class="text-center text-gray-600 text-sm py-4">
          <i class="fa-regular fa-message mb-2 text-xl"></i>
          <p>Hozircha chatlar mavjud emas</p>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 flex flex-col relative bg-[#212121] w-full">

    <!-- Header -->
    <header class="p-4 flex justify-between items-center absolute top-0 w-full z-20 bg-gradient-to-b from-[#212121] to-transparent">
      <button id="menu-btn" class="md:hidden bg-[#2f2f2f] p-2 rounded-lg border border-white/10 text-white">
        <i class="fa-solid fa-bars text-xl"></i>
      </button>
      
      <div id="auth-section" class="ml-auto">
        <button id="google-login" class="bg-white hover:bg-gray-100 text-gray-800 px-4 py-2 rounded-lg flex items-center gap-2 shadow-md transition-all">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/split_google.png" width="20" alt="Google">
          <span class="font-medium hidden sm:inline">Google bilan kirish</span>
          <span class="font-medium sm:hidden">Kirish</span>
        </button>

        <div id="user-info" class="hidden flex items-center gap-2 bg-[#2f2f2f] p-1 pr-3 rounded-full border border-white/10 shadow-lg">
          <img id="user-photo" class="w-8 h-8 rounded-full border-2 border-blue-500" alt="User photo">
          <span id="user-name" class="text-sm font-medium text-white hidden sm:inline"></span>
          <button id="logout-btn" class="text-gray-400 hover:text-white transition-colors ml-1 p-2" title="Chiqish">
            <i class="fa-solid fa-right-from-bracket"></i>
          </button>
        </div>
      </div>
    </header>

    <!-- Chat Container -->
    <div id="chat-container" class="flex-1 overflow-y-auto px-4 pt-20 pb-36 space-y-4 scroll-smooth"></div>

    <!-- Input Area -->
    <div class="absolute bottom-0 w-full px-2 pb-2 bg-gradient-to-t from-[#212121] via-[#212121] to-transparent pt-6 input-area">
      <div class="max-w-3xl mx-auto relative">
        <textarea
          id="user-input"
          rows="1"
          placeholder="Xabar yozing..."
          class="w-full bg-[#2f2f2f] text-white border border-white/10 rounded-2xl
                 p-3 pr-14 focus:outline-none focus:border-blue-500/50 focus:ring-2 focus:ring-blue-500/20
                 shadow-2xl resize-none transition-all disabled:opacity-50 disabled:cursor-not-allowed text-base"
          disabled
        ></textarea>

        <button
          id="send-btn"
          disabled
          class="absolute right-2 bottom-2 p-3 bg-blue-600 text-white rounded-xl hover:bg-blue-700 
                 transition-all disabled:opacity-50 disabled:cursor-not-allowed
                 shadow-lg flex items-center justify-center"
        >
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </div>
    </div>
  </main>

  <script type="module" src="script.js"></script>
  <script>
    // Mobil menu toggle
    document.addEventListener('DOMContentLoaded', function() {
      const menuBtn = document.getElementById('menu-btn');
      const closeBtn = document.getElementById('close-sidebar');
      const sidebar = document.getElementById('mobile-sidebar');
      const overlay = document.getElementById('sidebar-overlay');
      
      if (menuBtn && sidebar && overlay) {
        menuBtn.addEventListener('click', (e) => {
          e.preventDefault();
          sidebar.classList.add('open');
          overlay.classList.add('open');
          document.body.style.overflow = 'hidden';
        });
        
        const closeSidebar = () => {
          sidebar.classList.remove('open');
          overlay.classList.remove('open');
          document.body.style.overflow = '';
        };
        
        closeBtn.addEventListener('click', closeSidebar);
        overlay.addEventListener('click', closeSidebar);
      }
      
      // Input focus
      const userInput = document.getElementById('user-input');
      if (userInput) {
        userInput.addEventListener('touchstart', function() {
          this.focus();
        });
      }
      
      // Prevent zoom on input focus
      document.addEventListener('touchstart', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
          document.body.style.zoom = '1';
        }
      });
    });
  </script>
</body>
</html>
